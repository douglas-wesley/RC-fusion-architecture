# =============================================================================
# Configuracao Principal — Camera-Radar BEV Fusion
# =============================================================================
# Para mudar o caminho do dataset, use --dataroot no CLI ou edite data.dataroot.

# ── Dataset ──────────────────────────────────────────────────────────────────
data:
  dataroot: "./data/sets/nuscenes"       # Local (padrao)
  dataroot: "/content/data/sets/nuscenes"  # Colab (descomente aqui)
  version: "v1.0-mini"
  num_workers: 4
  pin_memory: true

  # Imagem
  image_size: [384, 672]                 # [H, W] — 16:9 reduzido
  image_mean: [0.485, 0.456, 0.406]     # ImageNet normalization
  image_std: [0.229, 0.224, 0.225]

  # BEV Grid
  bev_size: [128, 128]                   # [H, W] do grid BEV
  bev_range: [-50.0, 50.0]               # Metros (min, max) nos eixos X e Y

  # Radar
  radar_max_points: 200                  # Padding fixo para batching
  radar_input_channels: 4                # densidade, rcs, vx, vy
  radar_raw_channels: 18                 # Canais brutos do nuScenes radar

  # Annotations
  num_classes: 6                         # vehicle.car, truck, bus, bicycle, motorcycle, pedestrian
  category_mapping:
    vehicle.car: "vehicle.car"
    vehicle.truck: "vehicle.truck"
    vehicle.bus.bendy: "vehicle.bus"
    vehicle.bus.rigid: "vehicle.bus"
    vehicle.bicycle: "vehicle.bicycle"
    vehicle.motorcycle: "vehicle.motorcycle"
    human.pedestrian.adult: "human.pedestrian"
    human.pedestrian.child: "human.pedestrian"
    human.pedestrian.construction_worker: "human.pedestrian"
    human.pedestrian.police_officer: "human.pedestrian"

  # Train/Val split
  train_ratio: 0.7
  val_ratio: 0.3

# ── Modelo ───────────────────────────────────────────────────────────────────
model:
  backbone:
    name: "mobilenet_v2"                 # mobilenet_v2 | resnet18
    pretrained: true
    freeze_epochs: 5                     # Congelar backbone por N epochs

  view_transformer:
    type: "ipm"                          # ipm | mlp
    bev_h: 128
    bev_w: 128

  fusion:
    img_channels: 32                     # Canais do backbone (MobileNetV2 stage 4)
    radar_channels: 4                    # radar_input_channels
    out_channels: 64

  head:
    out_channels: 64
    num_outputs: 1                       # Binary segmentation

# ── Treinamento ──────────────────────────────────────────────────────────────
training:
  batch_size: 4
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  scheduler: "cosine"                    # cosine | step
  step_size: 20
  step_gamma: 0.1
  early_stopping_patience: 10
  seed: 42

  # Mixed precision ( economia de memoria GPU )
  use_amp: true

  # Checkpoints
  checkpoint_dir: "./checkpoints"        # Local
  checkpoint_dir: "/content/drive/MyDrive/PIBIC/fusion/checkpoints"  # Colab
  save_every_n_epochs: 5

  # Logging
  log_dir: "./logs"                      # Local
  log_dir: "/content/drive/MyDrive/PIBIC/fusion/logs"  # Colab
  use_tensorboard: true

# ── Inferencia ───────────────────────────────────────────────────────────────
inference:
  checkpoint_path: null                  # Caminho do .pth para carregar
  confidence_threshold: 0.5
